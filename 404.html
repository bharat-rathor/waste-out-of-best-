<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waste Out Best</title>
    <script>
      // GitHub Pages SPA fix
      // When GitHub 404s, redirect to index.html with the path encoded as a query param
      var segmentCount = 1; // Number of path segments in the repo name (e.g., /waste-out-of-best-/ = 1)
      var location = window.location;
      var path = location.pathname
        .slice(1)
        .split('/')
        .slice(segmentCount)
        .join('/');
      var query = location.search.slice(1);
      var hash = location.hash.slice(1);

      var redirectUrl =
        location.protocol +
        '//' +
        location.hostname +
        (location.port ? ':' + location.port : '') +
        location.pathname
          .split('/')
          .slice(0, 1 + segmentCount)
          .join('/') +
        '/?p=/' +
        path +
        (query ? '&q=' + query : '') +
        (hash ? '#' + hash : '');

      location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
